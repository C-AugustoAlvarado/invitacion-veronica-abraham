<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Grano de papel de algodón: mosaico continuo (stitchTiles), muy tenue -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7" stitchTiles="stitch" result="r"/>
    <feColorMatrix in="r" type="matrix" values="0 0 0 0 .36  0 0 0 0 .32  0 0 0 0 .22  0 0 0 -.7 .42"/>
  </filter>
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".0125" numOctaves="3" seed="11" stitchTiles="stitch" result="r"/>
    <feColorMatrix in="r" type="matrix" values="0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .30  0 0 0 -.34 .17"/>
  </filter>
  <rect width="320" height="320" filter="url(#f)" opacity=".5"/>
  <rect width="320" height="320" filter="url(#g)" opacity=".42"/>
</svg>
